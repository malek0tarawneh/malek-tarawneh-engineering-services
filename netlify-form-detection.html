<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Netlify Form Detection</title></head>
<body>
  <form name="service-request" method="POST" action="/thank-you.html" netlify data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data">
    <input type="hidden" name="form-name" value="service-request">
    <input name="bot-field">
    <input name="clientType">
    <input name="service">
    <input name="packageLevel">
    <input name="urgency">
    <input name="projectTitle">
    <textarea name="description"></textarea>
    <input name="clientName">
    <input name="email" type="email">
    <input name="phone">
    <input name="delivery">
    <input name="requestReference">
    <input type="file" name="attachments" multiple>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
